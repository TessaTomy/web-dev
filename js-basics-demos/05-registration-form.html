<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

    <style>
        body{
            display: grid;
            place-items: center;
            height: 100vh;
            width: 100vw;
            font-family: 'Courier New', Courier, monospace !important;
        }
        table tr td{
            padding: 10px 15px;
        }

        .textbox{
            padding: 15px;
            width: 100%;
            border: none;
            border-bottom: 2px black solid;
            background: none;
        }

        input[type='submit']
        {
            background: none;
            border-radius: 15px;
            padding: 10px 15px;
            margin-top: 10px;
            font-family: 'Courier New', Courier, monospace;
            font-weight: bolder;
        }
        input[type='submit']:hover
        {
            background: lightgray;
            border: none;
            border-radius: 15px;
            box-shadow:0px 0px 8px 2px ;
            padding: 10px 15px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <form action="">
        <h2 style="text-align: center;text-decoration: underline;">Registration Form</h2>
        <table>
            <tr>
                <td>
                    Name
                </td>
                <td>
                    <input type="text" placeholder="Enter Your Full Name " class="textbox">
                </td>
            </tr>
            <tr>
                <td>Gender</td>
                <td>
                    <input type="radio" name="gender" id="">Male
                    <input type="radio" name="gender" id="">Female
                    <input type="radio" name="gender" id="">Others
                </td>
            </tr>
            <tr>
                <td>
                    DOB
                </td>
                <td>
                    <input type="date" class="textbox">
                </td>
            </tr>
            <tr>
                <td>
                    Phone
                </td>
                <td>
                    <input type="number" name="" id="" class="textbox" placeholder="Enter Your Contact Number">
                </td>
            </tr>
            <tr>
                <td>
                    Address
                </td>
                <td>
                    <textarea name="" id="" class="textbox" rows="5" placeholder="Enter your address here...."></textarea>
                </td>
            </tr>
            <tr>
                <td>
                    Course
                </td>
                <td>
                    <select name="" id="" class="textbox">
                        <option value="" disabled selected>Select Your Course</option>
                        <option value="" >BCA</option>
                        <option value="">Bsc</option>
                        <option value="">BA</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Hobbies</td>
                <td>
                    <input type="checkbox" name="" id="">Singing
                    <input type="checkbox" name="" id="">Reading
                    <input type="checkbox" name="" id="">Others
                </td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;"> <input type="submit" value="Submit"></td>
            </tr>
            <tr>
                <td colspan="2" style="text-align: center;">----- Office Use -----</td>
            </tr>
            <tr>
                <td>
                    ID
                </td>
                <td>
                    <input type="text" class="textbox">
                </td>
            </tr>
            <tr>
                <td>
                    Status
                </td>
                <td style="text-align: center;">
                    <input type="radio" name="gender" id="">Approved
                    <input type="radio" name="gender" id="">Rejected
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
